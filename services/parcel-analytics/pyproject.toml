[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parcel-analytics"
version = "0.1.0"
description = "Notebook-first geospatial analytics workspace for parcel analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.3",
    "folium>=0.18.0",
    "geopandas>=1.0.1",
    "h3>=4.1.2",
    "httpx>=0.28.1",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
    "pyogrio>=0.10.0",
    "pytest>=8.3.4",
    "pyyaml>=6.0.2",
    "shapely>=2.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_analytics"]

[tool.uv]
package = true
