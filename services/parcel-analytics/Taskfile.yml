version: '3'

tasks:
  install:
    desc: Create virtual environment and install dependencies using uv
    cmd: uv sync

  start:
    desc: Launch Jupyter Lab in the notebooks workspace
    cmd: uv run jupyter lab --notebook-dir=notebooks

  notebook:
    desc: Launch Jupyter Lab in the notebooks workspace
    cmd: task start

  kernel:
    desc: Register a reusable Jupyter kernel for this workspace
    cmd: uv run python -m ipykernel install --user --name parcel-analytics --display-name "Python (parcel-analytics)"

  smoke:
    desc: Verify the package and core geospatial dependencies import cleanly
    cmd: uv run python -c "import duckdb, folium, geopandas, h3, httpx, pandas, pyarrow, pyogrio, shapely, yaml; import parcel_analytics; print(parcel_analytics.__version__)"

  test:
    desc: Run the parcel analytics test suite
    cmd: uv run pytest

  fetch-report-data:
    desc: Download official Queensland parcel and locality data for one configured report
    cmd: uv run python -m parcel_analytics.cli fetch-report-data --config config/reports.example.yaml --report {{.REPORT}}

  render-report:
    desc: Build histogram and hex outputs for one configured report
    cmd: uv run python -m parcel_analytics.cli render-report --config config/reports.example.yaml --report {{.REPORT}}
